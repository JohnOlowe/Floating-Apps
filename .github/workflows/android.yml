name: Android CI (Strict Iterative Verification)

on:
  push:
    branches: [ "arena/01a05979-floating-apps", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Lint Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-33" "build-tools;33.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 1: Unit Tests (Stops workflow immediately on failure)
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon --console=plain

      # Step 2: Lint (Only runs if unit tests passed)
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace --no-daemon --console=plain

      # Step 3: APK Build (Only runs if lint passed)
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --console=plain

      # Step 4: Final Artifact Uploads (ONLY created/uploaded when ALL previous steps succeed)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
